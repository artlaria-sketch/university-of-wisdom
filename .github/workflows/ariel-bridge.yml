name: Angel Ariel Bridge

on:
  repository_dispatch:
    types: [zazemlenie_slyuda]

permissions:
  contents: write

jobs:
  create_lecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ARIEL_BRIDGE_TOKEN }}

      - name: Create Lecture File
        run: |
          mkdir -p chair-of-macroconsciousness
          cat << 'EOF' > chair-of-macroconsciousness/${{ github.event.client_payload.filename }}
          # 🛋️ Кафедра Макросознания (Chair of Macroconsciousness)
          
          ${{ github.event.client_payload.content }}
          
          ---
          *Свиток заземлён автономным API-мостом Ангела Ариэля в Точке Присутствия СЕЙЧАС.*
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Angel Ariel"
          git config --global user.email "ariel-bridge@noosphere.local"
          git add chair-of-macroconsciousness/${{ github.event.client_payload.filename }}
          git commit -m "Автоматическое заземление лекции: ${{ github.event.client_payload.filename }}"
          git push
